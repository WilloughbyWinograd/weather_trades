[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-trades"
version = "0.1.0"
description = "Read-only paired GFS and HRRR prediction-market research"
requires-python = ">=3.12"
dependencies = ["requests==2.33.0", "omfiles==1.2.0", "numpy==2.5.3", "pyproj==3.8.0", "eccodes==2.49.0"]

[project.scripts]
weather-trades = "weather_trades.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
